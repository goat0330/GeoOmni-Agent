limit_req_zone $binary_remote_addr zone=geo_chat:10m rate=2r/s;

upstream geo_backend {
    server geo:4173;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /api/dizai/ai/agent/chat {
        limit_req zone=geo_chat burst=20 nodelay;

        proxy_pass http://geo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Required for DeepSeek/EventStream token-by-token delivery.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        gzip off;
    }

    location / {
        proxy_pass http://geo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Keep buffering disabled globally because the compiled application also uses SSE endpoints.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

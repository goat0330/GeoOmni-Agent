services:
  - type: web
    name: geo-omni-agent
    runtime: node
    plan: free
    branch: master
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: ALLOW_SOURCE_PROXY
        value: "false"
      - key: SOURCE_ORIGIN
        value: ""
      - key: SOURCE_TLS_VERIFY
        value: "true"
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_THINKING
        value: disabled
      - key: DEEPSEEK_API_KEY
        sync: false
